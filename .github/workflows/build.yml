name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Diagnose grpc dependency versions
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath | grep -i -B2 -A1 grpc || true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Every push publishes a release, which is what the in-app updater polls. The tag must stay
      # v<semver> and match the versionName built from the same run number, otherwise the installed
      # app can't tell the release is newer.
      - name: Attach APK to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Arc 1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
