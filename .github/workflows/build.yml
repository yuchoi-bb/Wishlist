name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Diagnose grpc dependency versions
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath | grep -i -B2 -A1 grpc || true

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # TODO: narrow back to "if: startsWith(github.ref, 'refs/tags/')" (dropping the tag_name/
      # name overrides) once the active crash-debugging cycle is done — this is deliberately
      # wide open for now so each debugging build is easy to fetch as a release asset.
      - name: Attach APK to release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
