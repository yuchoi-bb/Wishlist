name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept out of the repo (public) since it's per-Firebase-project; stored as a base64 secret
      # instead. Forks/PRs without the secret just build without Firebase configured, same as
      # the conditional google-services plugin apply in app/build.gradle.kts.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Secret length (base64 chars): ${#GOOGLE_SERVICES_JSON}"
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            echo "Decoded file size (bytes):"
            wc -c < app/google-services.json
            python3 -m json.tool app/google-services.json > /dev/null \
              && echo "google-services.json is valid JSON" \
              || { echo "::error::google-services.json failed to parse as JSON — the GOOGLE_SERVICES_JSON secret is likely truncated or corrupted"; exit 1; }
          else
            echo "GOOGLE_SERVICES_JSON secret not set; building without Firebase configured."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
