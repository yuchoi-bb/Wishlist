<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2E7D32; } a:hover { color: #1B5E20; }
    .ui { font-family: "IBM Plex Sans KR", system-ui, "Apple SD Gothic Neo", sans-serif; }
    .num { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
    .label { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; color: #8A9399; }
    .chip { padding: 6px 10px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 12px; color: #3D4448; }
    .chip-on { border-color: #2E7D32; background: #E8F0E9; color: #1B5E20; font-weight: 600; }
    .field { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; border: 1px solid #DDE1DF; border-radius: 8px; background: #FFFFFF; }
    .box { flex: none; width: 17px; height: 17px; border: 1.5px solid #C3C9C6; border-radius: 4px; }
    .sec { padding: 18px 16px; border-bottom: 1px solid #EDEFEE; }
  </style>
</helmet>

<div class="ui" style="width: 390px; height: 1180px; position: relative; overflow: hidden; background: #FFFFFF; color: #14181A;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 12px 0 8px; border-bottom: 1px solid #E6E9E8; background: #FFFFFF;">
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3D4448" stroke-width="1.7" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"></path>
      </svg>
      <span style="font-size: 15px; font-weight: 600;">할 일 수정</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 13px; color: #8A9399;">되돌리기</span>
      <span style="padding: 7px 14px; border-radius: 8px; background: #2E7D32; color: #FFFFFF; font-size: 13px; font-weight: 600;">저장</span>
    </div>
  </div>

  <div class="sec">
    <div class="label">할 일</div>
    <div style="margin-top: 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3;">8월 실적 보고</div>
    <div style="margin-top: 8px; height: 2px; background: #2E7D32; width: 132px;"></div>
  </div>

  <div class="sec">
    <div class="label">우선순위</div>
    <div style="display: flex; gap: 6px; margin-top: 10px;">
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; background: #14181A; color: #FFFFFF; font-size: 13px; font-weight: 600;">P1 <span style="font-weight: 400; opacity: 0.72;">높음</span></div>
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; border: 1px solid #DDE1DF; color: #5B6469; font-size: 13px;">P2 보통</div>
      <div style="flex: 1; text-align: center; padding: 9px 0; border-radius: 8px; border: 1px solid #DDE1DF; color: #5B6469; font-size: 13px;">P3 낮음</div>
    </div>
  </div>

  <div class="sec">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div class="label">최종 종료일 (목표일)</div>
      <div style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: #2E7D32; font-weight: 500;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round">
          <rect x="3.5" y="5.5" width="17" height="15" rx="2.5"></rect>
          <path d="M3.5 10h17M8 3.5v4M16 3.5v4"></path>
        </svg>
        캘린더 등록
      </div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 10px;">
      <span class="num" style="font-size: 22px; font-weight: 500; letter-spacing: -0.01em;">26.09.30</span>
      <span class="num" style="padding: 3px 7px; border-radius: 4px; background: #F2F4F3; color: #5B6469; font-size: 11px; font-weight: 500;">D-33</span>
      <span style="flex: 1;"></span>
      <span style="font-size: 12px; color: #8A9399;">지우기</span>
    </div>
    <div style="display: flex; gap: 6px; margin-top: 12px;">
      <div class="chip">월말</div>
      <div class="chip">8말</div>
      <div class="chip chip-on">9말</div>
      <div class="chip">A말</div>
      <div class="chip">B말</div>
    </div>
  </div>

  <div class="sec">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div class="label">세부항목</div>
      <div class="num" style="font-size: 11px; color: #8A9399;">0 / 3</div>
    </div>

    <div style="margin-top: 12px; padding: 10px 12px; border: 1px solid #E6E9E8; border-radius: 10px; background: #FBFCFB;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="box"></span>
        <span style="flex: 1; font-size: 14px;">데이터 취합</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A2AAAE" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px;">
        <span class="num" style="padding: 4px 8px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px;">26.08.28</span>
        <span style="padding: 4px 7px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px; color: #5B6469;">월말</span>
        <span style="padding: 4px 7px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px; color: #5B6469;">8말</span>
        <span style="padding: 4px 7px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px; color: #5B6469;">9말</span>
        <span style="flex: 1;"></span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5B6469" stroke-width="1.8" stroke-linecap="round">
          <rect x="3.5" y="5.5" width="17" height="15" rx="2.5"></rect>
          <path d="M3.5 10h17M8 3.5v4M16 3.5v4"></path>
        </svg>
      </div>
    </div>

    <div style="margin-top: 8px; padding: 10px 12px; border: 1px solid #E6E9E8; border-radius: 10px; background: #FBFCFB;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span class="box"></span>
        <span style="flex: 1; font-size: 14px;">초안 작성</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A2AAAE" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px;">
        <span class="num" style="padding: 4px 8px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px;">26.08.31</span>
        <span style="padding: 4px 7px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px; color: #5B6469;">월말</span>
        <span style="padding: 4px 7px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px; color: #5B6469;">8말</span>
        <span style="padding: 4px 7px; border-radius: 6px; border: 1px solid #DDE1DF; background: #FFFFFF; font-size: 11px; color: #5B6469;">9말</span>
        <span style="flex: 1;"></span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5B6469" stroke-width="1.8" stroke-linecap="round">
          <rect x="3.5" y="5.5" width="17" height="15" rx="2.5"></rect>
          <path d="M3.5 10h17M8 3.5v4M16 3.5v4"></path>
        </svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 0 2px;">
      <div style="flex: 1; height: 40px; border: 1px dashed #D5DAD8; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #A2AAAE;">세부항목 추가</div>
      <div style="flex: none; width: 40px; height: 40px; border-radius: 8px; background: #E8F0E9; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="label">분류</div>
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <div class="field" style="flex: 1;">
        <span style="font-size: 14px;">업무</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9399" stroke-width="1.8" stroke-linecap="round"><path d="M6 9.5l6 6 6-6"></path></svg>
      </div>
      <div class="field" style="flex: 1;">
        <span style="font-size: 14px;">보고</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A9399" stroke-width="1.8" stroke-linecap="round"><path d="M6 9.5l6 6 6-6"></path></svg>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 14px;">
      <span style="font-size: 11px; color: #6B7479; width: 52px;">대분류 색</span>
      <span style="width: 22px; height: 22px; border-radius: 11px; background: #4F7CFF; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px #14181A;"></span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #2FA37A;"></span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #E0693E;"></span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #8E5BD0;"></span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #C0397B;"></span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #2A9AAF;"></span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #B08A1E;"></span>
      <span style="width: 18px; height: 18px; border-radius: 9px; background: #5E6E8C;"></span>
      <span style="font-size: 11px; color: #8A9399;">자동</span>
    </div>
  </div>

  <div class="sec">
    <div class="label">메모</div>
    <div style="margin-top: 10px; padding: 12px; border: 1px solid #DDE1DF; border-radius: 8px; font-size: 13px; line-height: 1.55; color: #3D4448; min-height: 56px;">지난달 대비 증감 사유 한 줄씩 정리. 첨부는 공유 드라이브 폴더에.</div>
  </div>

  <div class="sec" style="display: flex; align-items: center; justify-content: space-between;">
    <div>
      <div class="label">시작일</div>
      <div class="num" style="margin-top: 6px; font-size: 14px; color: #3D4448;">26.08.12</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="box"></span>
      <span style="font-size: 14px;">완료</span>
    </div>
  </div>

  <div style="padding: 18px 16px 24px;">
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid #F0D5D5; border-radius: 8px; color: #B4232A; font-size: 13px; font-weight: 500;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4232A" stroke-width="1.8" stroke-linecap="round">
        <path d="M4.5 6.5h15M9.5 6.5V4.2h5v2.3M6.8 6.5l1 13h8.4l1-13"></path>
      </svg>
      할 일 삭제
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
